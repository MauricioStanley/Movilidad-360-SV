<!-- ============ DETALLE DE VEHÍCULO ============ -->
<div class="map-modal vehicle-modal" id="vehicleModal">
  <div class="map-modal-card vehicle-modal-card" role="dialog" aria-modal="true" aria-labelledby="vehicleModalTitle">
    <div class="map-modal-head">
      <h4 id="vehicleModalTitle">Sedán</h4>
      <button class="map-modal-close" id="vehicleModalClose" aria-label="Cerrar">&times;</button>
    </div>
    <div class="vehicle-modal-body">
      <div class="vehicle-modal-media" id="vehicleModalMedia"></div>
      <div class="vehicle-modal-tabs" id="vehicleModalTabs" role="group" aria-label="Unidades de esta flota"></div>
      <div class="vehicle-modal-info" id="vehicleModalInfo"></div>
      <p class="vehicle-modal-disclaimer">Estos son ejemplos de nuestra flota. El vehículo y el conductor exactos que te recogerán se confirman por WhatsApp antes de tu viaje.</p>
    </div>
    <div class="map-modal-foot">
      <button class="btn btn-outline-ink btn-sm" id="vehicleModalClose2">Cerrar</button>
      <button class="btn btn-gold btn-sm btn-wa" id="vehicleModalWa">Reservar por WhatsApp</button>
    </div>
  </div>
</div>
